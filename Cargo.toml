[workspace]
members = [
    "crates/gcodekit5-core",
    "crates/gcodekit5-communication",
    "crates/gcodekit5-camtools",
    "crates/gcodekit5-designer",
    "crates/gcodekit5-gcodeeditor",
    "crates/gcodekit5-visualizer",
    "crates/gcodekit5-settings",
    "crates/gcodekit5-devicedb",
    "crates/gcodekit5-ui",
]
resolver = "2"

[workspace.package]
version = "1.2.0-beta.2"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["GCodeKit Contributors"]
repository = "https://github.com/thawkins/gcodekit5"

[workspace.dependencies]
tracing = "0.1"
anyhow = "1.0"
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.8"

[package]
name = "gcodekit5-design"
autotests = false
version.workspace = true
edition.workspace = true
description = "A Rust-based Universal G-Code Sender for Laser and CNC machines with support for GRBL, TinyG, g2core, Smoothieware, and FluidNC controllers"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

# The binary keeps the product name that the release workflow, the
# Windows installer, the flatpak and the desktop file expect.
[[bin]]
name = "gcodekit5"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[dependencies]
gcodekit5-ui = { path = "crates/gcodekit5-ui" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
anyhow = "1.0"

[package.metadata.deb]
maintainer = "GCodeKit Contributors"
copyright = "2025, GCodeKit Contributors"
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/gcodekit5", "usr/bin/", "755"],
    ["assets/pictures/com.github.thawkins.gcodekit5.png", "usr/share/icons/hicolor/256x256/apps/com.github.thawkins.gcodekit5.png", "644"],
    ["flatpak/com.github.thawkins.gcodekit5.desktop", "usr/share/applications/com.github.thawkins.gcodekit5.desktop", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gcodekit5", dest = "/usr/bin/gcodekit5", mode = "755" },
    { source = "assets/pictures/com.github.thawkins.gcodekit5.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.github.thawkins.gcodekit5.png", mode = "644" },
    { source = "flatpak/com.github.thawkins.gcodekit5.desktop", dest = "/usr/share/applications/com.github.thawkins.gcodekit5.desktop", mode = "644" },
]

[dev-dependencies]
mutants = "0.0.3"

[patch.crates-io]
core2 = { git = "https://github.com/bbqsrc/core2", rev = "545e84bcb0f235b12e21351e0c69767958efe2a7" }

[[test]]
name = "all"
path = "tests/all.rs"
