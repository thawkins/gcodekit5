[package]
name = "gcodekit5-visualizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "G-code visualization and parsing for GCodeKit4"

[dependencies]
gcodekit5-core = { path = "../gcodekit5-core" }
regex = "1.10"
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
glam = "0.29"

[dev-dependencies]
gcodekit5-camtools = { path = "../gcodekit5-camtools" }
proptest = "1.4"
tempfile = "3.10"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "pipeline_bench"
harness = false
