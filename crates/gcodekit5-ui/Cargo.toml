[package]
name = "gcodekit5-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Slint-based user interface for GCodeKit4"
autotests = false

[dependencies]
gcodekit5-core = { path = "../gcodekit5-core" }
gcodekit5-communication = { path = "../gcodekit5-communication" }
gcodekit5-camtools = { path = "../gcodekit5-camtools" }
gcodekit5-designer = { path = "../gcodekit5-designer" }
gcodekit5-visualizer = { path = "../gcodekit5-visualizer" }
gcodekit5-settings = { path = "../gcodekit5-settings" }
gcodekit5-devicedb = { path = "../gcodekit5-devicedb" }
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_6"] }
sourceview5 = "0.9"
glib = "0.20"
gio = "0.20"
rfd = "0.15.4"
lyon = "1.0"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
once_cell = "1.20"
anyhow = "1.0"
dirs = "6.0"
glam = "0.29"
glow = "0.17"
libloading = "0.8"
gettext-rs = { version = "0.7", features = ["gettext-system"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.5"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[build-dependencies]
glib-build-tools = "0.20.0"


[dev-dependencies]
tempfile = "3.8"

[features]
slint_legacy_tests = []

[[test]]
name = "all"
path = "tests/all.rs"
