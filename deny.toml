# cargo-deny configuration for dependency auditing
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Permitimos paquetes obsoletos de terceros para saltarnos las 3 versiones de ttf-parser
unmaintained = "none"
ignore = [
    # gettext-rs < 0.8: setlocale/TextDomain::init touch the environment
    # without synchronisation. The app calls setlocale once, on the main
    # thread, before any other thread starts (gcodekit5-ui i18n::init). The
    # fix in 0.8 makes these functions `unsafe`, which needs a sanctioned
    # unsafe block to adopt.
    "RUSTSEC-2026-0244",
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016",
    "BSL-1.0", "CC0-1.0", "MPL-2.0", "OpenSSL", "EUPL-1.2", "NCSA",
]
confidence-threshold = 0.8
exceptions = [
    # Pure-Rust libbzip2 port pulled in by zip 9 (bzip2 support); permissive BSD-style licence.
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io, plus the one git dependency the workspace patches in
# ([patch.crates-io] core2 in Cargo.toml).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/bbqsrc/core2"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

